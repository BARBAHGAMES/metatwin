# Dependabot: security fixes and routine updates, as reviewable PRs (never auto-merged).
# Minor/patch bumps are grouped so the repo isn't flooded with one PR per package.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Nairobi
    open-pull-requests-limit: 5
    groups:
      # ESLint packages must move together: @eslint/js 10 needs eslint 10.
      eslint:
        patterns: ["eslint", "eslint-*", "@eslint/*", "typescript-eslint", "globals"]
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node runtime (.nvmrc = 22), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Nairobi
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
